name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自检
        run: node tools/validate.mjs

      - name: 打包
        run: python3 tools/pack.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ask-ai-extension
          path: dist/*.zip
